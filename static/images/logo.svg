<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <style>
            .navy-stroke { fill: none; stroke: #0f2b5c; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
            .navy-fill { fill: #0f2b5c; }
            .yellow-stroke { fill: none; stroke: #f6ba28; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
            .blue-stroke { fill: none; stroke: #1d72f2; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
            .logo-title { font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif; font-weight: 900; font-size: 54px; fill: #0f2b5c; letter-spacing: 7px; text-anchor: middle; }
            .logo-subtitle { font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 13.5px; fill: #0f2b5c; letter-spacing: 5.5px; text-anchor: middle; }
        </style>
    </defs>

    <!-- Outer House / Shield Frame -->
    <path class="navy-stroke" d="M 155 170 L 145 170 L 145 145 L 250 55 L 355 145 L 355 170 L 345 170 L 345 250 C 345 295 305 330 270 335" />
    <path class="navy-stroke" d="M 155 170 L 155 250 C 155 295 195 330 230 335" />

    <!-- Interwoven Hexagonal Links -->
    <!-- Yellow Loop (Left) -->
    <path class="yellow-stroke" d="M 250 120 L 195 152 L 195 245 L 245 277 L 270 260" />
    <path class="yellow-stroke" d="M 220 170 L 220 230 L 250 250 L 258 243" />
    <path class="yellow-stroke" d="M 250 148 L 220 170" />

    <!-- Royal Blue Loop (Right) -->
    <path class="blue-stroke" d="M 250 120 L 305 152 L 305 245 L 250 280 L 215 305" />
    <path class="blue-stroke" d="M 250 148 L 280 170 L 280 230 L 250 250" />

    <!-- Text: U KOST -->
    <text x="250" y="405" class="logo-title">U KOST</text>

    <!-- Subtitle: STUDENT LIVING SOLUTIONS -->
    <text x="250" y="435" class="logo-subtitle">STUDENT LIVING SOLUTIONS</text>
</svg>
